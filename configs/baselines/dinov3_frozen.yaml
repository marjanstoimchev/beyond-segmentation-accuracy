# Frozen-encoder probe — the dense-prediction analog of a linear probe: the encoder is locked, only the head trained.
# Train: mxseg train -c configs/train_kodiak.yaml --set kodiak.train_blocks=0 --set kodiak.checkpoint=weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth --name dinov3_frozen
# then:  mxseg eval -b configs/baselines/dinov3_frozen.yaml [--split test] [--unit region]
baseline: kodiak
name: dinov3_frozen
params:
  weights: runs/dinov3_frozen/weights.pt
  min_area: 15
  batch_size: 16
  device: null
input:                                    # the training input (stored with the weights, which win): LAP2 red, blank, DAPI blue
  red: LAP2
  green: null
  blue: DAPI
