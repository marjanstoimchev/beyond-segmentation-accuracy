# KODIAK — slide-pretrained ViT-S/16 + UNETR head, fine-tuned with the Cellpose flow objective (the transformer-friendly
# one: measured +0.13 val/f1 over the 3-class protocol with everything else identical).
# Train: mxseg train -c configs/train_kodiak.yaml --set kodiak.objective=flows --name kodiak_flows
# then:  mxseg eval -b configs/baselines/kodiak_flows.yaml [--split test] [--unit region]
baseline: kodiak
name: kodiak_flows
params:
  weights: runs/kodiak_flows/weights.pt   # min-val/loss weights (objective + architecture stored inside; decoded by flow-following)
  min_area: 15
  batch_size: 16
  device: null                            # null = cuda | mps | cpu, auto-detected
input:                                    # the training input (stored with the weights, which win): LAP2 red, blank, DAPI blue
  red: LAP2
  green: null
  blue: DAPI
