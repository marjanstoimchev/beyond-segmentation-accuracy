# Frozen-encoder probe — the dense-prediction analog of a linear probe: the encoder is locked, only the head trained.
# Train: mxseg train -c configs/train_kodiak.yaml --set kodiak.train_blocks=0 --name kodiak_frozen
# then:  mxseg eval -b configs/baselines/kodiak_frozen.yaml [--split test] [--unit region]
baseline: kodiak
name: kodiak_frozen
params:
  weights: runs/kodiak_frozen/weights.pt
  min_area: 15
  batch_size: 16
  device: null
input:                                    # the training input (stored with the weights, which win): LAP2 red, blank, DAPI blue
  red: LAP2
  green: null
  blue: DAPI
