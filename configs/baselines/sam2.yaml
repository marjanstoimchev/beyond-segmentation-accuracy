# SAM 2.1 few-shot — prompted by a prototype of 8 ground-truth training nuclei (PerSAM-style; no training anywhere).
# mxseg eval -b configs/baselines/sam2.yaml [--split test] [--unit region]
baseline: sam2
name: sam2
params:
  checkpoint: sam2.1_hiera_small
  n_exemplars: 8             # ground-truth nuclei from the training split (the method's entire supervision)
  exemplar_seed: 0           # deterministic exemplar draw; change to measure variance over draws
  sim_threshold: 0.7         # similarity-map peaks above this become prompts
  peak_min_distance: 6
  box_scale: 2.4             # box prompt = this x the exemplars' median radius
  pred_iou_thresh: 0.7
  min_area: 15
  max_mask_area: 3000
  max_area_frac: 0.1
  claimed_frac: 0.5          # a mask mostly claimed by an already-kept one is a duplicate
  contrast: none            # was clahe: it equalizes each channel independently, which
  #                           changes the marker ratios a composite encodes
  exemplar_dataset: null     # null = $MXDATA_ROOT/dataset
  points_per_batch: 128
  device: null
input:                     # THE SHARED PROTOCOL INPUT: the same marker image every trained row sees (mxseg/inputs.py),
  red: LAP2                #   on the slide's stored statistics. Zero-shot and prompted rows now differ from the trained
  green: null              #   ones only in that they were never trained -- not in what they are shown.
  blue: DAPI
