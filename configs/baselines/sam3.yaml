# SAM 3 few-shot — 8 exemplar boxes become one cached prompt; the detector finds every matching nucleus in one pass.
# Strongest untrained method (val F1 ~0.75, on par with the trained models).
# mxseg eval -b configs/baselines/sam3.yaml [--split test] [--unit region]
baseline: sam3
name: sam3
params:
  prompt: exemplars
  n_exemplars: 8             # ground-truth nuclei boxes from the training split (the method's entire supervision)
  exemplar_seed: 0           # deterministic; F1 stable across draws (0.754 / 0.757 for seeds 0 / 1)
  detection_threshold: 0.5
  mask_threshold: 0.5
  text: cell                 # unused in exemplar mode (kept for completeness)
  min_area: 15
  max_area_frac: 0.1
  claimed_frac: 0.5
  contrast: none            # was clahe: it equalizes each channel independently, which
  #                           changes the marker ratios a composite encodes
  exemplar_dataset: null     # null = $MXDATA_ROOT/dataset
input:                     # THE SHARED PROTOCOL INPUT: the same marker image every trained row sees (mxseg/inputs.py),
  red: LAP2                #   on the slide's stored statistics. Zero-shot and prompted rows now differ from the trained
  green: null              #   ones only in that they were never trained -- not in what they are shown.
  blue: DAPI
