# SAM 3 zero-shot — the text prompt alone, no exemplars, no supervision of any kind.
# The bare noun "cell" works; "a cell" and "nucleus" return zero detections (measured). Threshold 0.3 measured best for text.
# mxseg eval -b configs/baselines/sam3_text.yaml [--split test] [--unit region]
baseline: sam3
name: sam3_text
params:
  prompt: text
  text: cell
  detection_threshold: 0.3   # text scores run lower than exemplar scores: 0.3 -> F1 0.61 vs 0.21 at the exemplar default 0.5
  mask_threshold: 0.5
  min_area: 15
  max_area_frac: 0.1
  claimed_frac: 0.5
  contrast: none            # was clahe: it equalizes each channel independently, which
  #                           changes the marker ratios a composite encodes
input:                     # THE SHARED PROTOCOL INPUT: the same marker image every trained row sees (mxseg/inputs.py),
  red: LAP2                #   on the slide's stored statistics. Zero-shot and prompted rows now differ from the trained
  green: null              #   ones only in that they were never trained -- not in what they are shown.
  blue: DAPI
