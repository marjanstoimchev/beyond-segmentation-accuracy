# KODIAK segmenter: the pretrained encoder fine-tuned on the identical 3-class protocol as the U-Net.   `mxseg train -c configs/train_kodiak.yaml`
# Same data as every other model: same split, same patches, same augmentation draws (seed) — see runs/<name>/data_manifest.json.
# Pretrain first (python -m kodiak.pretrain -c configs/kodiak_pretrain.yaml), or point checkpoint at weights/dinov3_*.pth
# for the no-slide-pretraining ablation (plain DINOv3 features).
name: kodiak_vits16
data: configs/dataset.yaml
model: kodiak
input:                         # what the network sees (mxseg/inputs.py): the two channels the reference boundaries were drawn from,
  red: LAP2                    #   nuclear envelope and nuclei, on the dataset's stored slide statistics; the third channel stays blank
  green: null
  blue: DAPI
optim:                         # THE optimizer recipe, identical for every trained model (mxseg/train/module.py)
  lr: 2.0e-3                   # peak lr: the new decoder / head; a pretrained encoder layer i of L trains at lr * 0.75^(L + 1 - i)
  layerwise_decay: 0.75        # ViT fine-tuning best practice, applied to every pretrained encoder (ViT blocks, ResNet stages)
  weight_decay: 0.05           # on >= 2-D parameters only (no decay on biases, norms, tokens)
  warmup_epochs: 2             # linear warm-up, then cosine decay towards final_lr_fraction * lr over the remaining epochs
  final_lr_fraction: 0.01
# Optimizer: the shared `optim:` recipe below (identical for every trained model), plus stochastic depth while the encoder
# trains; weights.pt = the minimum-val/loss epoch. Data, input, loss, targets and budget are identical to every other model.
kodiak:
  checkpoint: runs/kodiak_mxif/checkpoints/last.ckpt       # KODIAK pretraining checkpoint (its EMA teacher) or a DINOv3 .pth; null = scratch
  # THE ENCODER — the same keys, with the same names, as the `model:` block of configs/kodiak_pretrain.yaml, so a pretraining
  # run and the fine-tuning that consumes its checkpoint are read side by side. The checkpoint must match exactly (it is loaded
  # whole or not at all); a mismatch names the architecture the file actually holds.
  vit_patch_size: 16           # DINOv3 ViT-S/16 — weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth (21.6M)
  vit_embed_dim: 384           #   ViT-B/16 — weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth (85.7M): set 768 here and 12 below
  vit_depth: 12                #   (patch_size 16, depth 12, mlp_ratio 4.0 and 4 storage tokens are the same for S and B)
  vit_heads: 6                 #   ViT-B: 12
  vit_mlp_ratio: 4.0
  num_storage_tokens: 4
  train_blocks: 12             # ViT blocks (of vit_depth) trained, counted from the top: all = full fine-tune, 0 = head only (frozen encoder)
  objective: flows             # the Cellpose protocol (flow field -> follow flows): +0.13 val/f1 over threeclass, measured
  boundary_px: 2               # threeclass only (the U-Net-protocol ablation: --set kodiak.objective=threeclass)
  drop_path_rate: 0.1          # stochastic depth while the encoder trains (dropped automatically when it is frozen)
  encoder_upsample: 2          # 8 px per token: +0.09 val/f1 over the native 16 px grid (nuclei are 10-20 px; measured, controlled)
  bottleneck: multi            # decoder reads blocks 5+8+final fused (+0.005 frozen f1 over final-only; final block is the worst layer)
  dice_weight: 1.0             # loss = masked cross-entropy + dice_weight * masked soft Dice (nucleus + boundary classes)
  min_area: 15                 # drop instances under 15 px after the watershed
epochs: 20                     # the shared fine-tuning budget: every trained method gets 20 epochs
batch_size: 4                  # x grad_accumulation 4 = the shared batch of 16 per optimizer step (2x tokens do not fit at once on 19 GB)
grad_accumulation: 4
num_workers: 0
accelerator: auto              # auto | mps | cuda | cpu
precision: 32-true
seed: 0
augment:
  flip: true
  rot90: true
val:
  every_n_epochs: 1            # ViT-S inference is cheap: instance metrics every epoch (the kept weights follow val/loss, every epoch)
  n_metric_patches: 40
  monitor: val/loss           # the kept weights = the epoch with the minimum validation loss — one rule for every trained model
out: runs
